name: Collect CUDA investigation results
on:
  push:
    branches: [investigate/cuda-contrib-build-time]
    paths: [.github/workflows/finalize-cuda-investigation.yml]
permissions:
  actions: read
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Wait for experiments and preserve a verified candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/finalize_cuda_investigation.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cuda-investigation-results
          path: ${{ runner.temp }}/CUDA_CONTRIB_RESULTS.md
          retention-days: 14
