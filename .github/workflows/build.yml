# This experimental branch specializes the existing, dispatchable build workflow.
# The default branch retains the all-platform shared-library workflow.
name: Build unsigned WASM SIMD pthread XNNPACK static library

on:
  push:
  workflow_dispatch:
    inputs:
      version:
        description: "ONNX Runtime version (this branch supports 1.23.2)"
        required: true
        default: "1.23.2"
      target:
        description: "Build target (generic onnxruntime only)"
        type: choice
        default: onnxruntime
        options:
          - onnxruntime
      release:
        description: "Create a draft prerelease after validation"
        type: boolean
        default: false
      code_signing:
        description: "Must remain false: this build is unsigned"
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  ONNXRUNTIME_VERSION: ${{ inputs.version || '1.23.2' }}
  # microsoft/onnxruntime v1.23.2, verified before preparing this build.
  ONNXRUNTIME_COMMIT: a83fc4d58cb48eb68890dd689f94f28288cf2278
  EMSCRIPTEN_VERSION: "4.0.8"
  TARGET_LIBRARY: ${{ inputs.target || 'onnxruntime' }}
  CODE_SIGNING: ${{ inputs.code_signing && 'true' || 'false' }}

jobs:
  build-wasm-static-lib:
    if: github.repository == 'Hiroshiba/onnxruntime-builder'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Validate unsigned generic build inputs
        run: |
          test "$ONNXRUNTIME_VERSION" = '1.23.2'
          test "$TARGET_LIBRARY" = 'onnxruntime'
          test "$CODE_SIGNING" = 'false'
          echo "RELEASE_NAME=onnxruntime-wasm-static-simd-threaded-xnnpack-$ONNXRUNTIME_VERSION" >> "$GITHUB_ENV"

      - name: Checkout builder
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          path: builder
          persist-credentials: false

      - name: Checkout ONNX Runtime
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: microsoft/onnxruntime
          ref: ${{ env.ONNXRUNTIME_COMMIT }}
          submodules: recursive
          path: onnxruntime
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Cache pinned Emscripten toolchain
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            onnxruntime/cmake/external/emsdk/upstream
            onnxruntime/cmake/external/emsdk/node
            onnxruntime/cmake/external/emsdk/zips
          key: wasm-xnnpack-emsdk-${{ runner.os }}-${{ env.EMSCRIPTEN_VERSION }}

      - name: Cache pinned native dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: dependency-cache
          key: wasm-xnnpack-deps-${{ runner.os }}-${{ env.ONNXRUNTIME_COMMIT }}-${{ env.EMSCRIPTEN_VERSION }}-${{ hashFiles('builder/build-wasm-threaded.bash', 'builder/xnnpack-static-dependencies.patch') }}

      - name: Build and validate SIMD pthread XNNPACK static library
        run: bash builder/build-wasm-threaded.bash

      - name: Preserve unvalidated output for diagnosis on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: onnxruntime-wasm-static-simd-threaded-xnnpack-diagnostics
          path: |
            onnxruntime/build/Release/libonnxruntime_webassembly.a
            onnxruntime/build/Release/CMakeCache.txt
            onnxruntime/build/Release/compile_commands.json
            onnxruntime/build/Release/onnxruntime_webassembly.ar
            onnxruntime/include/onnxruntime
            onnxruntime/build/smoke
            dependency-cache/pthreadpool-build/libpthreadpool.a
          if-no-files-found: ignore
          retention-days: 7

      - name: Archive artifact
        run: |
          mv artifact "$RELEASE_NAME"
          tar -czf "$RELEASE_NAME.tgz" "$RELEASE_NAME"
          sha256sum "$RELEASE_NAME.tgz" > "$RELEASE_NAME.tgz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: onnxruntime-wasm-static-simd-threaded-xnnpack
          path: |
            ${{ env.RELEASE_NAME }}.tgz
            ${{ env.RELEASE_NAME }}.tgz.sha256
          if-no-files-found: error

  create-draft-release:
    needs: build-wasm-static-lib
    if: github.event_name == 'workflow_dispatch' && inputs.release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: onnxruntime-wasm-static-simd-threaded-xnnpack

      - name: Create unsigned draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_name="onnxruntime-wasm-static-simd-threaded-xnnpack-$ONNXRUNTIME_VERSION"
          sha256sum --check "$release_name.tgz.sha256"
          cat > release-notes.md <<EOF_NOTES
          Generic ONNX Runtime $ONNXRUNTIME_VERSION static library for wasm32 Emscripten.
          Ordinary SIMD and pthreads enabled; XNNPACK EP enabled. FP32 models, no relaxed SIMD or fast-math. Unsigned; no VOICEVOX production sources or signing credentials used.

          - Emscripten: $EMSCRIPTEN_VERSION
          - ONNX Runtime source: $ONNXRUNTIME_COMMIT
          - Builder source: $GITHUB_SHA
          - Validation: XNNPACK Conv1d and ConvTranspose1d inference matched scalar FP32 reference
          - Profiling proved both operators ran on XnnpackExecutionProvider
          - Thread creation verified ORT global threads=1 (zero workers), XNNPACK threads=2 (one worker)
          - Static archive includes XNNPACK and pthreadpool dependencies; compile commands audited
          - Browser performance and VOICEVOX CORE integration still require the separate benchmark

          Link the final application with -pthread -msimd128 -fwasm-exceptions -fno-fast-math -ffp-contract=off using Emscripten $EMSCRIPTEN_VERSION.
          Preallocate a sufficient pthread worker pool and serve the browser app with COOP/COEP headers.
          See WASM_THREADED.md and BUILD_INFO.json in the archive for details.
          EOF_NOTES
          # Do not overwrite or replace an existing release/tag on a rerun.
          gh release create "$release_name" \
            "$release_name.tgz" "$release_name.tgz.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$release_name (unsigned)" \
            --notes-file release-notes.md \
            --draft --prerelease
