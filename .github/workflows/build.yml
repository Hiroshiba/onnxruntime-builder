# 処理の流れ
# 1. 以下の二つを順不同で行う
#   a. create-draft-release: タグなしでdraft releaseを先に作成
#   b. （VOICEVOX ONNX Runtimeのみ）利用規約を取得
# 2. build-onnxruntime等: 各成果物をdraft releaseにアップロード
# 3. b.と2.の情報からreleaseのbodyを作成

name: Build C++ Shared Library
run-name: CUDA contrib investigation — repeat maximal option removals (16 cold builds)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "バージョン情報（A.BB.C / A.BB.C-preview.D）"
        required: true
      commit_hash:
        description: "ONNX Runtimeのコミットハッシュ（指定時はバージョンタグの代わりに使用）"
        required: false
      target:
        description: "ビルド対象"
        type: choice
        default: onnxruntime
        options:
          - onnxruntime
          - voicevox_onnxruntime
      release:
        description: "リリースするかどうか"
        type: boolean
      code_signing:
        description: "コード署名する"
        type: boolean
        required: false
        default: false

env:
  TARGET_LIBRARY: |-
    onnxruntime
  ONNXRUNTIME_VERSION:
    |- # workflow_dispatchでのバージョン名が入る。無指定なら適当なバージョン
    ${{ inputs.version || '1.31.0' }}
  ONNXRUNTIME_CHECKOUT_REF: |-
    ${{ inputs.commit_hash || format('v{0}', inputs.version || '1.31.0') }}
  VOICEVOX_ONNXRUNTIME_CHECKOUT_REF: |-
    ${{ inputs.commit_hash || format('refs/tags/v{0}-voicevox', inputs.version || '1.31.0') }}
  RELEASE: |- # workflow_dispatchでのreleaseフラグがあればリリースする
    false

defaults:
  run:
    shell: bash

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ env.TARGET_LIBRARY }}-${{ env.ONNXRUNTIME_VERSION }}
    steps:
      - name: Nop
        run: ":"

  # 他のリポジトリとは異なり、既存の同名のtag_nameがあることを許容する。
  # 何故なら本リポジトリではリリースの差し替えを行うため。ゆえにimmutable releaseも使わない。
  create-draft-release:
    needs: config
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      # `RELEASE`がtrueなら、GitHub REST APIの`Release`オブジェクトの一部。falseならnull。
      release: ${{ steps.create-draft-release.outputs.release || 'null' }}
    steps:
      - name: Create a tagless draft release
        if: env.RELEASE == 'true'
        id: create-draft-release
        run: |
          name=${{ needs.config.outputs.tag }}
          release=$(
            gh api \
              "/repos/$GITHUB_REPOSITORY/releases" \
              --method POST \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              -f tag_name= \
              -f "target_commitish=$GITHUB_SHA" \
              -f name=$name \
              -F draft=true \
              -q '{ upload_url, id }'
          )
          echo "release=$release" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-onnxruntime:
    name: ${{ matrix.artifact_name }}
    needs: create-draft-release
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        # TODO: 外せる`--compile_no_warning_as_error`は外す
        include:
          - artifact_name: ${{ inputs.target || 'onnxruntime' }}-win-x64-cuda-combined-r2
            os: windows-2022
            spec_os: Windows
            spec_arch: x86_64
            linux_cross_arch: ""
            symlink_workaround: false
            cuda_version: 12.8.1
            # Windowsの場合デフォルトのパッケージ群では不十分であるため、必要そうなパッケージを指定する。ただしいくつかは不要かもしれない
            cuda_sub_packages: |
              ["cudart",
               "cuobjdump",
               "nvrtc",
               "nvrtc_dev",
               "nvcc",
               "nvdisasm",
               "thrust",
               "cublas_dev",
               "cufft_dev",
               "curand_dev",
               "cusolver_dev",
               "cusparse_dev",
               "visual_studio_integration"]
            cudnn_url: https://developer.download.nvidia.com/compute/cudnn/redist/cudnn/windows-x86_64/cudnn-windows-x86_64-9.8.0.87_cuda12-archive.zip
            build_opts: |-
              --compile_no_warning_as_error
              --use_cuda
              --cmake_extra_defines
              # そのままビルドするとGitHub ActionsのRunnerが耐えきれなくなってビルドが落ちるのでビルドを軽量化する
              onnxruntime_NVCC_THREADS=1
              onnxruntime_QUICK_BUILD=ON
              CMAKE_CUDA_ARCHITECTURES=75\;80\;90
              onnxruntime_CUDA_FATBIN_COMPRESS_SIZE=ON
              onnxruntime_BUILD_UNIT_TESTS=OFF
            release_config: Release
          - artifact_name: ${{ inputs.target || 'onnxruntime' }}-linux-x64-cuda-combined-r2
            os: ubuntu-22.04
            spec_os: Linux
            spec_arch: x86_64
            linux_cross_arch: ""
            symlink_workaround: false
            gcc_version: "13"
            cuda_version: 12.9.1
            cuda_sub_packages: "[]" # デフォルト
            cudnn_url: https://developer.download.nvidia.com/compute/cudnn/redist/cudnn/linux-x86_64/cudnn-linux-x86_64-9.8.0.87_cuda12-archive.tar.xz
