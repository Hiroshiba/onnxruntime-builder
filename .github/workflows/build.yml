      # prefix usage: "", "arm-linux-gnueabihf-" => "gcc-8", "arm-linux-gnueabihf-gcc-8" (command name)
      # suffix usage: "", "-arm-linux-gnueabihf" => "gcc-8", "gcc-8-arm-linux-gnueabihf" (package name)
      ARCH_PREFIX: "${{ (matrix.linux_cross_arch != '' && matrix.linux_cross_arch) || '' }}${{ (matrix.linux_cross_arch != '' && '-') || '' }}"
      ARCH_SUFFIX: "${{ (matrix.linux_cross_arch != '' && '-') || '' }}${{ (matrix.linux_cross_arch != '' && matrix.linux_cross_arch) || '' }}"

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    environment: ${{ inputs.target == 'voicevox_onnxruntime' && 'production' || '' }}

    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Version check (semver)
        run: |
          VERSION=$ONNXRUNTIME_VERSION
          if [[ $VERSION =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$ ]]; then
            echo "Version: $VERSION"
          else
            echo "$VERSION is not a valid semver."
            exit 1
          fi

      - name: Dump matrix context
        env:
          MATRIX_CONTEXT: ${{ toJSON(matrix) }}
        run: echo "$MATRIX_CONTEXT" > matrix.json

      - name: Cold build (do not restore or save build caches)
        id: cache-build-result
        run: echo 'cache-hit=false' >> "$GITHUB_OUTPUT"

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        if: steps.cache-build-result.outputs.cache-hit != 'true' && runner.os == 'Linux' && contains(matrix.build_opts, '--use_cuda')
        with:
          large-packages: false
          preinstalled-runtimes: false
          swap-storage: false

      - name: Install tree
        if: steps.cache-build-result.outputs.cache-hit != 'true' && runner.os == 'Windows'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          install: tree

      - name: Install tree for debug
        if: steps.cache-build-result.outputs.cache-hit != 'true' && runner.os == 'macOS'
        run: brew install tree

      - name: Use Xcode 16.1 for WebGPU builds
        if: steps.cache-build-result.outputs.cache-hit != 'true' && runner.os == 'macOS' && contains(matrix.build_opts, '--use_webgpu')
        run: |
          xcode_path=/Applications/Xcode_16.1.app
          if [[ ! -d $xcode_path ]]; then
            echo "Xcode 16.1 is not installed" >&2
            exit 1
          fi

          sudo xcode-select -s "$xcode_path/Contents/Developer"
          xcodebuild -version

      - name: Install and configure build dependencies on Linux
        if: steps.cache-build-result.outputs.cache-hit != 'true' && startsWith(matrix.os, 'ubuntu')
        env:
          GCC_VERSION: ${{ matrix.gcc_version }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              build-essential \
              git \
              wget \
              qemu-user-binfmt

          if [ -n "$GCC_VERSION" ]; then
            . /etc/os-release
            if [ "$VERSION_CODENAME" = "jammy" ] && [ "$GCC_VERSION" -ge 13 ]; then
              sudo apt-get install -y software-properties-common
              sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
              sudo apt-get update
            fi

            sudo apt-get install -y \
                gcc-"$GCC_VERSION""$ARCH_SUFFIX" \
                g++-"$GCC_VERSION""$ARCH_SUFFIX"

            # Set environment variable CC / CXX
            {
              echo "CC=${ARCH_PREFIX}gcc-$GCC_VERSION"
              echo "CXX=${ARCH_PREFIX}g++-$GCC_VERSION"
              echo "CUDAHOSTCXX=${ARCH_PREFIX}g++-$GCC_VERSION"
            } >> "$GITHUB_ENV"
          fi

      - name: Install newer binutils
        if: steps.cache-build-result.outputs.cache-hit != 'true' && matrix.os == 'ubuntu-22.04' && (contains(matrix.build_opts, '--use_cuda') || contains(matrix.build_opts, '--use_webgpu'))
        env:
          BINUTILS_VERSION: "2.42"
          BINUTILS_SHA256: f6e4d41fd5fc778b06b7891457b3620da5ecea1006c6a4a41ae998109f85a800
        run: |
          wget -O binutils.tar.xz "https://ftp.gnu.org/gnu/binutils/binutils-$BINUTILS_VERSION.tar.xz"
          echo "$BINUTILS_SHA256  binutils.tar.xz" | sha256sum --check
          mkdir binutils-src binutils-build
          tar -xf binutils.tar.xz --strip-components=1 -C binutils-src

          (
            cd binutils-build
            ../binutils-src/configure \
              --prefix="/opt/binutils-$BINUTILS_VERSION" \
              --disable-nls \
              --disable-werror
            make -j"$(nproc)" all-binutils all-gas
            sudo make install-binutils install-gas
          )

          echo "/opt/binutils-$BINUTILS_VERSION/bin" >> "$GITHUB_PATH"
          echo "COMPILER_PATH=/opt/binutils-$BINUTILS_VERSION/bin" >> "$GITHUB_ENV"

          "/opt/binutils-$BINUTILS_VERSION/bin/as" --version

      # ONNX Runtime v1.23.0 requires CMake 3.28 or higher.
      - name: Install CMake
        if: steps.cache-build-result.outputs.cache-hit != 'true' && startsWith(matrix.os, 'ubuntu')
        env:
          CMAKE_VERSION: 3.28.0
        run: |
          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64) ARCH_DL="x86_64" ;;
            aarch64 | arm64) ARCH_DL="aarch64" ;;
            *) echo "Unsupported architecture: $ARCH" >&2; exit 1 ;;
          esac
          wget -O cmake.sh "https://github.com/Kitware/CMake/releases/download/v$CMAKE_VERSION/cmake-$CMAKE_VERSION-linux-$ARCH_DL.sh"
          sudo bash cmake.sh --skip-license --prefix=/usr/local

      - name: Set up CUDA
        if: steps.cache-build-result.outputs.cache-hit != 'true' && matrix.cuda_version && matrix.cudnn_url
        uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d # v0.2.36
        with:
          cuda: ${{ matrix.cuda_version }}
          sub-packages: ${{ matrix.cuda_sub_packages }}
          method: network

      - name: Set `$CUDA_HOME`
        if: steps.cache-build-result.outputs.cache-hit != 'true' && matrix.cuda_version && matrix.cudnn_url
        run: echo "CUDA_HOME=$CUDA_PATH" >> "$GITHUB_ENV"

      - name: Set up cuDNN
        if: steps.cache-build-result.outputs.cache-hit != 'true' && matrix.cuda_version && matrix.cudnn_url
        run: |
          download_dir=$RUNNER_TEMP/cudnn
          mkdir "$download_dir"

          if [ ${{ runner.os }} = Windows ]; then
            curl -fL --retry 3 --retry-delay 5 "${{ matrix.cudnn_url }}" > "$download_dir/cudnn.zip"
            unzip "$download_dir/cudnn.zip" -d "$download_dir"
            rm "$download_dir/cudnn.zip"
          else
            curl -fL --retry 3 --retry-delay 5 "${{ matrix.cudnn_url }}" > "$download_dir/cudnn.tar.gz"
            tar xvf "$download_dir/cudnn.tar.gz" -C "$download_dir/"
            rm "$download_dir/cudnn.tar.gz"
          fi

          cudnn_path=$(find "$download_dir" -maxdepth 1 -name 'cudnn-*')
          if [ ${{ runner.os }} = Windows ]; then
            cudnn_path=$(cygpath -wa "$cudnn_path")
          else
            cudnn_path=$(realpath "$cudnn_path")
          fi

          echo "CUDNN_HOME=$cudnn_path" >> "$GITHUB_ENV"

      - name: Configure to use latest Android NDK
        if: steps.cache-build-result.outputs.cache-hit != 'true' && startsWith(matrix.os, 'ubuntu') && contains(matrix.build_opts, '--android')
        run: |
          # https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2004-Readme.md#environment-variables-2
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      # workaround for https://github.com/actions/checkout/issues/1201
      - name: Stash build directory
        if: steps.cache-build-result.outputs.cache-hit == 'true'
        run: mv ./build "$RUNNER_TEMP/"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.TARGET_LIBRARY == 'onnxruntime'
        with:
          repository: microsoft/onnxruntime
          submodules: recursive
          ref: ${{ env.ONNXRUNTIME_CHECKOUT_REF }}

      - name: Restore the stashed build directory
        if: steps.cache-build-result.outputs.cache-hit == 'true'
        run: mv "$RUNNER_TEMP/build" .

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.TARGET_LIBRARY == 'voicevox_onnxruntime'
        with:
          repository: microsoft/onnxruntime
          submodules: recursive
          ref: v${{ env.ONNXRUNTIME_VERSION }}
          token: ${{ secrets.PRODUCTION_GITHUB_TOKEN }}

      - name: Switch to production
        id: switch-to-production
        if: env.TARGET_LIBRARY == 'voicevox_onnxruntime'
        run: |
          (
            git remote add private "$PRODUCTION_REPOSITORY_URL"
            git fetch private "$VOICEVOX_ONNXRUNTIME_CHECKOUT_REF"
            git switch -d FETCH_HEAD
          ) 1>>${{ matrix.artifact_name }}_stdout.txt 2>>${{ matrix.artifact_name }}_stderr.txt
        env:
          PRODUCTION_REPOSITORY_URL: ${{ secrets.PRODUCTION_REPOSITORY_URL }}

      - name: Checkout builder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: builder

      - name: Apply patch
        run: |
          for patch in ./builder/*.patch; do
            if [[ $patch == */fix-cuda-disabled-contrib-ops.patch ]] && ! ${{ contains(matrix.build_opts, '--disable_contrib_ops') }}; then
              continue
            fi
            git apply --ignore-whitespace --reject --whitespace=fix --verbose "$patch"
          done

      - name: Configure build environment for cross-compiling on Linux
        if: steps.cache-build-result.outputs.cache-hit != 'true' && startsWith(matrix.os, 'ubuntu') && matrix.linux_cross_arch
        run: |
          # Required for arm build
          # https://github.com/microsoft/onnxruntime/issues/4189#issuecomment-642528278
          echo 'string(APPEND CMAKE_C_FLAGS " -latomic")' >> cmake/CMakeLists.txt
          echo 'string(APPEND CMAKE_CXX_FLAGS " -latomic")' >> cmake/CMakeLists.txt

          # Prevent Exec Format Error during cross-compiling
          if ${{ matrix.symlink_workaround }}; then
            find /usr/${{ matrix.linux_cross_arch }}/lib -name '*.so*' -print0 |
              while IFS= read -r -d '' so; do
                sudo ln -s "$so" /usr/lib/${{ matrix.linux_cross_arch }}/
              done
            sudo ln -s /usr/${{ matrix.linux_cross_arch }}/lib/ld-linux-*.so* /usr/lib/
          fi

      - name: Run prepare.bash
        id: prepare
        if: env.TARGET_LIBRARY == 'voicevox_onnxruntime'
        run: ./prepare.bash 1>>${{ matrix.artifact_name }}_stdout.txt 2>>${{ matrix.artifact_name }}_stderr.txt

      - name: Build ONNX Runtime
        timeout-minutes: 320
        id: build
        if: steps.cache-build-result.outputs.cache-hit != 'true'
        run: |
          # TODO: ↓ この記述は VOICEVOX/voicevox_core#41 時点でのarmhfビルドに対するもの。`CMAKE_SYSTEM_{NAME,PROCESSOR}`が必要のないケースが多いはず。例えばv1.17時点では、AndroidとiOSのビルドではcpuinfoのケアまでちゃんとされているはず。なので調べる。
          # add --arm for gcc-8: https://github.com/microsoft/onnxruntime/issues/4189
          # skip test: https://github.com/microsoft/onnxruntime/issues/2436
          # ONNX Runtime v1.9.0 requires CMAKE_SYSTEM_PROCESSOR, https://github.com/microsoft/onnxruntime/releases/tag/v1.9.0
          # Both CMAKE_SYSTEM_NAME and CMAKE_SYSTEM_PROCESSOR are required.

          if ${{ contains(matrix.artifact_name, '-win-arm64') && endsWith(matrix.artifact_name, '-webgpu') }}; then
            # windowsでwebgpuターゲットにクロスコンパイルすると`llvm-tblgen.exe`と`clang-tblgen.exe`のビルドに失敗する。
            # これを回避するために事前にx64ターゲットで`llvm-tblgen.exe`と`clang-tblgen.exe`のみをビルドしてクロスコンパイル時にそれを使うことで対処する。
            # ref: https://github.com/microsoft/onnxruntime/blob/v1.23.2/tools/ci_build/github/azure-pipelines/stages/nodejs-win-packaging-stage.yml#L92-L106
            (
              python ./tools/ci_build/build.py \
                --build_dir ./build \
                --config Release \
                --update \
                --parallel \
                --build_shared_lib \
                --no_telemetry \
                --compile_no_warning_as_error \
                --use_webgpu

              cmake --build ./build/Release \
                --config Release \
                --target llvm-tblgen clang-tblgen
            ) \
              1>${{ env.TARGET_LIBRARY == 'onnxruntime' && '&1' || format('> {0}_stdout.txt', matrix.artifact_name) }} \
              2>${{ env.TARGET_LIBRARY == 'onnxruntime' && '&2' || format('> {0}_stderr.txt', matrix.artifact_name) }}

            mkdir ./Windows_WebGPU_BuildTools
            cp ./build/Release/_deps/dawn-build/third_party/directx-shader-compiler/src/Release/bin/llvm-tblgen.exe ./Windows_WebGPU_BuildTools
            cp ./build/Release/_deps/dawn-build/third_party/directx-shader-compiler/src/Release/bin/clang-tblgen.exe ./Windows_WebGPU_BuildTools

            rm -rf ./build
          fi

          build_opts=(
          ${{ matrix.build_opts }}
          )

          # v1.31.0ではテレメトリが既定で有効になるため、従来通り無効にする。
          python ./tools/ci_build/build.py \
            --build_dir ./build \
            --config Release \
            --update \
            --build \
            --parallel \
            --build_shared_lib \
            --no_telemetry \
            "${build_opts[@]}" \
            2>&1 | tee "$RUNNER_TEMP/cuda-build.log"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostics-${{ matrix.artifact_name }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/cuda-build.log
            build/Release/CMakeCache.txt
            build/Release/CMakeFiles/CMakeConfigureLog.yaml

      - name: Inspect the build directory for debug
        id: inspect-build-dir
        if: steps.cache-build-result.outputs.cache-hit != 'true'
        run: |
          if [ ${{ runner.os }} = Windows ]; then
            tree() {
              msys2.cmd -c "tree $1"
            }
          fi
          tree build \
            1${{ env.TARGET_LIBRARY == 'onnxruntime' && '>&1' || format('>> {0}_stdout.txt', matrix.artifact_name) }} \
            2${{ env.TARGET_LIBRARY == 'onnxruntime' && '>&2' || format('>> {0}_stderr.txt', matrix.artifact_name) }}

      - name: Show size of the build directory for debug (before removing unnecessary files)
        if: steps.cache-build-result.outputs.cache-hit != 'true' && env.TARGET_LIBRARY == 'onnxruntime'
        run: du -hd 0 ./build

      # 全キャッシュの合計を10GBよりちょっと少なめ程度に抑えられれば十分とする。
      - name: Remove known unnecessary files
        if: steps.cache-build-result.outputs.cache-hit != 'true' && env.TARGET_LIBRARY == 'onnxruntime'
        run: |
          find ./build -maxdepth 1 -name Packages -print -exec rm -r {} +
          find ./build/Release -maxdepth 1 '(' -name _deps -o -name testdata ')' -print -exec rm -r {} +
          find ./build/Release -maxdepth 1 '(' -name '*.a' -o -name '*.lib' -not -name onnxruntime.lib ')' -print -delete
          find ./build/Release/CMakeFiles -mindepth 1 -maxdepth 1 -not -name Export -print -exec rm -r {} +
          find ./build/Release -maxdepth 2 -path '*/${{ matrix.release_config }}/*_test*.app' -print -exec rm -r {} +

      - name: Show size of the build directory for debug (after removing unnecessary files)
        if: steps.cache-build-result.outputs.cache-hit != 'true' && env.TARGET_LIBRARY == 'onnxruntime'
        run: du -hd 0 ./build

      - name: Encrypt log
        if: |
          failure()
          && (
            steps.switch-to-production.outcome == 'failure'
            || steps.prepare.outcome == 'failure'
            || steps.build.outcome == 'failure'
            || steps.inspect-build-dir.outcome == 'failure'
          )
          && env.TARGET_LIBRARY == 'voicevox_onnxruntime'
        run: |
          for file in ./${{ matrix.artifact_name }}_{stdout,stderr}.txt; do
            gpg -ef ./builder/log-encryption-pub.asc "$file"
          done

      - name: Upload the encrypted log
        if: |
          failure()
          && (
            steps.switch-to-production.outcome == 'failure'
            || steps.prepare.outcome == 'failure'
            || steps.build.outcome == 'failure'
            || steps.inspect-build-dir.outcome == 'failure'
          )
          && env.TARGET_LIBRARY == 'voicevox_onnxruntime'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: log_${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}_*.txt.gpg

      # Organize artifactのcopy_strip_binary.shがarm-linux-gnueabihf-stripを使うが、
      # 依存関係のインストールはキャッシュヒット時にスキップされるため、ここで別途用意する。
      - name: Install binutils for artifact stripping on Linux
        if: startsWith(matrix.os, 'ubuntu') && matrix.linux_cross_arch
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils"$ARCH_SUFFIX"

      - name: Organize artifact
        run: |
          if [ ${{ runner.os }} != Windows ]; then
            cd ./build/Release
            # make installだとビルド結果がキャッシュされていても再ビルドが走ってしまうので、cmake -P cmake_install.cmakeを使う
            DESTDIR=../installed cmake -P cmake_install.cmake
            cd ../..
          fi
          if [ ${{ runner.os }} = Linux ]; then
            # Linuxではcopy_strip_binaryがlib64を参照するがmake installではlibしか生成されないのでmvする。
            # TODO: 本来はちゃんとlib64を生成するようにすべき（要調査）
            mv ./build/installed/usr/local/lib ./build/installed/usr/local/lib64
          fi

          # コピー先artifactを予め削除しておく
          rm -rf build/${{ matrix.artifact_name }}
          rm -rf ./artifact
          # Set library name
          ARTIFACT_NAME=${{ matrix.artifact_name }}
          if [[ "$ARTIFACT_NAME" == "$TARGET_LIBRARY"-win-* ]]; then
            # FIXME: この分岐はもう使わないのでは?
            onnxruntime_filename=$TARGET_LIBRARY.dll
          elif [[ "$ARTIFACT_NAME" == "$TARGET_LIBRARY"-linux-* ]]; then
            onnxruntime_filename="lib$TARGET_LIBRARY.so.$ONNXRUNTIME_VERSION"
          elif [[ "$ARTIFACT_NAME" == "$TARGET_LIBRARY"-android-* ]]; then
            onnxruntime_filename="lib$TARGET_LIBRARY.so"
          elif [[ "$ARTIFACT_NAME" == "$TARGET_LIBRARY"-osx-* ]] || [[ "$ARTIFACT_NAME" == "$TARGET_LIBRARY"-ios-* ]]; then
            onnxruntime_filename="lib$TARGET_LIBRARY.$ONNXRUNTIME_VERSION.dylib"
          else
            echo "Unknown target found : ${{ matrix.artifact_name }}"
            return 1
          fi
          # PDBファイル, Privacy.md, include/は不要なので省く
          if [ ${{ runner.os }} = Windows ]; then
            # https://github.com/microsoft/onnxruntime/blob/v1.16.3/tools/ci_build/github/azure-pipelines/templates/c-api-artifacts-package-and-publish-steps-windows.yml#L34-L72
            mkdir -p ./build/${{ matrix.artifact_name }}/lib
            git rev-parse HEAD > ./build/${{ matrix.artifact_name }}/GIT_COMMIT_ID
            cp ./{LICENSE,README.md,ThirdPartyNotices.txt,VERSION_NUMBER} \
              ./build/${{ matrix.artifact_name }}/
            cp ./build/${{ matrix.release_config }}/${{ matrix.release_config }}/"$TARGET_LIBRARY".{dll,lib} \
              ./build/${{ matrix.artifact_name }}/lib/
            if [ -f ./build/${{ matrix.release_config }}/${{ matrix.release_config }}/"$TARGET_LIBRARY"_providers_cuda.dll ]; then
              cp ./build/${{ matrix.release_config }}/${{ matrix.release_config }}/"$TARGET_LIBRARY"_providers_{cuda,shared}.{dll,lib} \
                ./build/${{ matrix.artifact_name }}/lib/
            fi
          else
            ./tools/ci_build/github/linux/copy_strip_binary.sh \
              -r "$(pwd)/build" \
              -a ${{ matrix.artifact_name }} \
              -l "$onnxruntime_filename" \
              -c ${{ matrix.release_config }} \
              -s "$(pwd)" \
              -t "$(git rev-parse HEAD)"
            rm -r build/${{ matrix.artifact_name }}/{Privacy.md,include}
          fi
          if [ "$TARGET_LIBRARY" = voicevox_onnxruntime ]; then
            rm build/${{ matrix.artifact_name }}/{README.md,LICENSE,ThirdPartyNotices.txt}
            mv ./VOICEVOX_ORT_TERMS.md build/${{ matrix.artifact_name }}/TERMS.txt
            mv ./build/third-party-notices.html ./build/${{ matrix.artifact_name }}
          fi
          mv build/${{ matrix.artifact_name }} ./artifact/

      - name: Code signing (Windows)
        if: runner.os == 'Windows' && inputs.code_signing
        run: |
          find ./artifact/lib -name '*.dll' -print0 |
            while IFS= read -r -d '' dll; do
              ./builder/codesign_windows.bash "$dll"
            done
        env:
          ESIGNERCKA_USERNAME: ${{ secrets.ESIGNERCKA_USERNAME }}
          ESIGNERCKA_PASSWORD: ${{ secrets.ESIGNERCKA_PASSWORD }}
          ESIGNERCKA_TOTP_SECRET: ${{ secrets.ESIGNERCKA_TOTP_SECRET }}

      - name: Code signing (macOS)
        if: runner.os == 'macOS' && inputs.code_signing
        run: |
          find ./artifact/lib -name '*.dylib' -print0 |
            while IFS= read -r -d '' dylib; do
              ./builder/codesign_macos.bash "$dylib"
            done
        env:
          APPLE_P12_BASE64: ${{ secrets.APPLE_P12_BASE64 }}
          APPLE_P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: artifact/*

      - name: Generate RELEASE_NAME
        run: |
          echo RELEASE_NAME=${{ matrix.artifact_name }}-"$ONNXRUNTIME_VERSION" >> "$GITHUB_ENV"

      - name: Generate specifications
        run: |
          build_opts=(
          ${{ matrix.build_opts }}
          )

          os=${{ matrix.spec_os }}
          arch=${{ matrix.spec_arch }}

          for arg in "${build_opts[@]}"; do
            case "$arg" in
              --use_cuda) use_cuda=1 ;;
              --use_dml) use_dml=1 ;;
              --use_webgpu) use_webgpu=1 ;;
            esac
          done

          jq '
            {
              "os": $os,
              "arch": $arch,
              # ONNX Runtimeが示す順番に従う
              "devices": [
                ("CUDA" | select($use_cuda == "1")),
                ("DirectML" | select($use_dml == "1")),
                ("WebGPU" | select($use_webgpu == "1")),
                "CPU"
              ] | join("/")
            }' \
            -n \
            --arg os "$os" \
            --arg arch "$arch" \
            --arg use_cuda "$use_cuda" \
            --arg use_dml "$use_dml" \
            --arg use_webgpu "$use_webgpu" \
            > "$RELEASE_NAME.json"

      - name: Upload specifications
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: specs-${{ matrix.artifact_name }}
          path: ${{ env.RELEASE_NAME }}.json

      - name: Rearchive artifact
        if: env.RELEASE == 'true'
        run: |
          mv artifact/ "$RELEASE_NAME"
          tar cfz "$RELEASE_NAME.tgz" "$RELEASE_NAME/"

      - name: Upload to Release
        if: env.RELEASE == 'true'
        uses: ./builder/.github/actions/upload-gh-release-assets
        with:
          upload-url: ${{ fromJson(needs.create-draft-release.outputs.release).upload_url }}
          files: ${{ env.RELEASE_NAME }}.tgz

  summarize-option-trials:
    if: always()
    needs: build-onnxruntime
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare repeated measurements by build phase
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/summarize_cuda_timings.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cuda-phase-timings
          path: |
            CUDA_PHASE_TIMINGS.md
            CUDA_PHASE_TIMINGS.csv
          retention-days: 14
