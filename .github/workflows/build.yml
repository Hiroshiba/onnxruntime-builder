# Publication-only branch: reuse the tested archive without rebuilding ONNX Runtime.
name: Publish verified unsigned WASM pthread archive

on:
  push:
  workflow_dispatch:
    inputs:
      version:
        description: "Existing archive version (1.23.2 only)"
        required: true
        default: "1.23.2"
      target:
        description: "Existing generic archive only"
        type: choice
        default: onnxruntime
        options:
          - onnxruntime
      release:
        description: "Publish the verified archive as a public prerelease"
        type: boolean
        default: true
      code_signing:
        description: "Must remain false"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

env:
  SOURCE_RUN_ID: "37582013167"
  SOURCE_WORKFLOW_ID: "246510935"
  SOURCE_COMMIT: 1e46dc4d7fab9f635d6210e0029094661c9f623d
  SOURCE_BUILD_RUN_ID: "37580026341"
  SOURCE_BUILD_COMMIT: 544ff6330dd87f79c55714d4e3bed6046e7d95d9
  SOURCE_BRANCH: validate/wasm-simd-pthreads-benchmark
  RELEASE_NAME: onnxruntime-wasm-static-simd-threaded-1.23.2
  # Verified against successful validation-run metadata and independently downloaded bytes.
  EXPECTED_ARTIFACT_ID: "11464604756"
  EXPECTED_ARTIFACT_DIGEST: sha256:a9f95480cbd1c833ac2cdc5baaff79b78701a118d4e190f4199dc54610ab3434
  EXPECTED_ARCHIVE_SHA256: bdc024237b8303feb24c237bc7c8c07fdabd12a2bb7049684ed2894c580a63d1
  EXPECTED_MANIFEST_SHA256: 45d64457b4c811b0f72427834d544512bee605ca5252d8efb1ec91bd080699d5
  EXPECTED_LIBRARY_SHA256: 0d62a53ddb7924704abb640daa55153e15f0cc1eca63d5f2a191f23654f7b57a

jobs:
  verify:
    if: >-
      github.repository == 'Hiroshiba/onnxruntime-builder'
      && github.ref == 'refs/heads/publish/wasm-simd-pthreads-benchmark'
      && (github.event_name == 'push' || inputs.release)
    runs-on: ubuntu-22.04
    steps:
      - name: Validate fixed unsigned publication
        env:
          VERSION: ${{ inputs.version || '1.23.2' }}
          TARGET: ${{ inputs.target || 'onnxruntime' }}
          SIGNING: ${{ inputs.code_signing && 'true' || 'false' }}
        run: |
          test "$VERSION" = '1.23.2'
          test "$TARGET" = 'onnxruntime'
          test "$SIGNING" = 'false'
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_ARTIFACT_ID" =~ ^[0-9]+$ ]]
          [[ "$EXPECTED_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          for pin in "$EXPECTED_ARCHIVE_SHA256" "$EXPECTED_MANIFEST_SHA256" "$EXPECTED_LIBRARY_SHA256"; do
            [[ "$pin" =~ ^[0-9a-f]{64}$ ]]
          done

      - name: Verify completed source run and immutable artifact identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > source-run.json
          jq -e \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg sha "$SOURCE_COMMIT" \
            --arg branch "$SOURCE_BRANCH" \
            --argjson run "$SOURCE_RUN_ID" \
            --argjson workflow "$SOURCE_WORKFLOW_ID" \
            '.id == $run and .workflow_id == $workflow and .path == ".github/workflows/build.yml"
             and .head_sha == $sha and .head_branch == $branch and .event == "push"
             and .name == "Validate existing unsigned WASM pthread archive"
             and .repository.full_name == $repo and .head_repository.full_name == $repo
             and .run_attempt == 1 and .status == "completed" and .conclusion == "success"' \
            source-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$EXPECTED_ARTIFACT_ID" > source-artifact.json
          jq -e \
            --argjson id "$EXPECTED_ARTIFACT_ID" \
            --argjson run "$SOURCE_RUN_ID" \
            --arg sha "$SOURCE_COMMIT" \
            --arg digest "$EXPECTED_ARTIFACT_DIGEST" \
            '.id == $id and .name == "onnxruntime-wasm-static-simd-threaded"
             and .expired == false and .digest == $digest
             and .workflow_run.id == $run and .workflow_run.head_sha == $sha' \
            source-artifact.json

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ env.EXPECTED_ARTIFACT_ID }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
          path: candidate
          merge-multiple: true

      - name: Verify archive, manifest, library and smoke result
        run: python verify-wasm-release.py candidate

  publish:
    needs: verify
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ env.EXPECTED_ARTIFACT_ID }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
          merge-multiple: true

      - name: Publish the exact verified archive without replacement
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s  %s.tgz\n' "$EXPECTED_ARCHIVE_SHA256" "$RELEASE_NAME" | sha256sum --check
          sha256sum --check "$RELEASE_NAME.tgz.sha256"
          # A preexisting tag could point elsewhere; never reuse, replace or delete it.
          if response=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_NAME" 2>&1); then
            echo '::error::Release tag already exists; stop for review.'
            exit 1
          elif [[ "$response" != *'(HTTP 404)'* ]]; then
            printf '%s\n' "$response" >&2
            exit 1
          fi
          cat > release-notes.md <<EOF_NOTES
          Generic ONNX Runtime 1.23.2 static library, SIMD and pthreads enabled.
          Unsigned experimental prerelease. Public Microsoft sources only.

          - ONNX Runtime source: a83fc4d58cb48eb68890dd689f94f28288cf2278
          - Library compilation source: $SOURCE_BUILD_COMMIT
          - Original compilation run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$SOURCE_BUILD_RUN_ID
          - Validation source: $SOURCE_COMMIT
          - Successful corrected validation: https://github.com/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID
          - Emscripten: 4.0.8
          - Archive SHA-256: $EXPECTED_ARCHIVE_SHA256
          - Validation: Node.js pthread create/join and ORT inference with two intra-op threads passed
          - Browser VOICEVOX CORE integration and performance are measured separately

          The original compilation run completed the archive but failed its initial ordinary-environment smoke.
          This exact archive was subsequently validated with the global pool required by the default WASM session options.
          ONNX Runtime was not rebuilt during validation or publication.

          Link with -pthread -msimd128 -fwasm-exceptions and an adequate pthread worker pool.
          Browser deployment requires COOP/COEP headers and shared-memory support.
          See WASM_THREADED.md and BUILD_INFO.json in the archive.
          EOF_NOTES
          gh release create "$RELEASE_NAME" \
            "$RELEASE_NAME.tgz" "$RELEASE_NAME.tgz.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_BUILD_COMMIT" \
            --title "$RELEASE_NAME (unsigned)" \
            --notes-file release-notes.md \
            --prerelease --latest=false
