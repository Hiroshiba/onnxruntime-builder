name: Control CUDA contrib investigation
on:
  push:
    branches: [investigate/cuda-contrib-build-time]
    paths: [.github/workflows/dispatch-investigation.yml]
permissions:
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel the superseded branch-creation build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_REF: ${{ github.ref_name }}
        run: |
          gh run cancel 40313919867 --repo "$GH_REPO"
